# Publishes the app to GitHub Pages on every push to main, after the checks pass.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions"
# (and the custom domain there; see docs/DEPLOY.md).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Google Drive backups: the OAuth Client ID is kept in the repository's Actions secrets, never in the code.
    # Empty (secret not set) = the Drive buttons stay off. Set for the whole job, because the browser tests
    # build the site again (playwright.config.ts webServer) and that build is the one that gets published.
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the browser tests check the built page itself (CSP, home-screen tags, offline): no deploy if they fail
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      # Craft apps (src/craft/apps.json): official web zips, checked against their SHA-256, into dist/apps/
      - uses: actions/cache@v5
        with:
          path: .craft-cache
          key: craft-${{ hashFiles('src/craft/apps.json') }}
          restore-keys: craft-
      - run: npm run craft:dist
      - uses: actions/configure-pages@v6
      # v5 (Node 24) leaves out files whose names start with a dot unless told; v3 took them, so the site stays the same
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
