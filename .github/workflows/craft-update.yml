# Every day: looks for new versions of the Craft apps in src/craft/apps.json, and for new Craft apps,
# and opens a pull request with the changes. Nothing goes live until the owner merges it.
# New apps arrive switched off ("enabled": false): try them on the iPad, then switch them on.
# One-time setup: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Craft apps update
on:
  schedule:
    - cron: '17 21 * * *' # 03:17 Dhaka time
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: check
        run: node tools/check-craft-updates.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: craft-apps-update
          commit-message: 'Craft apps: new versions'
          title: 'Craft apps: new versions / new apps'
          body: |
            ${{ steps.check.outputs.summary }}

            Before merging: open the preview on the iPad and check each changed app opens, saves into ProNotes, and shows Bangla.
          add-paths: src/craft/apps.json
