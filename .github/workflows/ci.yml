# Checks every push to main: types, unit tests, a production build and the browser tests (Chromium).
# WebKit (closest to iPad Safari) is left out here: it has never been run in this project's checks.
name: CI
on:
  push:
    branches: 
    - main
    - feature/law-dictionary
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
