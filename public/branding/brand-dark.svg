      <use href="#page" xlink:href="#page" fill="#D9DADD"/>
      <use href="#fold" xlink:href="#fold" fill="#D4A017"/>
      <use href="#p" xlink:href="#p" fill="#FFFFFF"/>
    </g><text x="160" y="91" font-family="Manrope, Inter, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-1.1" fill="#FFFFFF">ProNotes</text>
