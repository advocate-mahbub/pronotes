<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="440" height="120" viewBox="0 0 440 120"
     role="img" aria-labelledby="title desc">
  <title id="title">ProNotes Primary Logo Light</title>
  <desc id="desc">ProNotes folded-paper P mark, using the corrected reference proportions.</desc>
  
<defs>
  <path id="page" d="M0 31 H70 V116 H0 Z"/>
  <path id="fold" d="M26 84 H70 V116 Z"/>
  <path id="p" d="M26 0 H58
