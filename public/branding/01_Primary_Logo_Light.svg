    C110 65.2 87 84 58 84
    H26 Z"/>
</defs>

  <rect width="440" height="120" fill="#FFFFFF"/>
    <g transform="translate(0 2) scale(1)">
      <use href="#page" xlink:href="#page" fill="#D9DADD"/>
      <use href="#fold" xlink:href="#fold" fill="#D4A017"/>
      <use href="#p" xlink:href="#p" fill="#0B1F4B"/>
    </g><text x="130" y="82" font-family="Manrope, Inter, Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="-1.2" fill="#0B1F4B">ProNotes</text>
</svg>